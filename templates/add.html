<!-- templates/add.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/styles/style.css">
</head>
<body>
<div class="phone">
    <div class="container">
        <div class="card-head">
            <label>Новый препарат</label>
        </div>
        <div class="add-page">
            {{ if .error }}
            <div class="error-message">{{ .error }}</div>
            {{ else }}
            <form>
                <div class="form-group">
                    <label>Название*</label>
                    <input type="text" value="{{ .service.Title }}">
                </div>
                <div class="form-group">
                    <label>Доза</label>
                    <label style="font-size: 13px; margin-top:auto;">(взрослого)</label>
                    <input type="number" value="{{ .service.AdultDose }}">
                    <label>мг/кг</label>
                </div>
                <div class="form-group">
                    <label>Концентрация</label>
                    <div class="input-with-label">
                        <input class="NoBorder" type="number" value="{{ .service.Concentration.Mg}}">
                        <label> / </label>
                        <input class="NoBorder" type="number" value="{{ .service.Concentration.Ml}}">
                    </div>
                    <label>мг/мл</label>
                </div>
                <div class="form-group DescriptionText">
                    <label>Дополнительная информация</label>
                    <textarea rows="3">{{ .service.Description }}</textarea>
                </div>
                <div class="form-group">
                    <label>Фото</label>
                    <input class="form-group-file" type="file" accept="image/*">
                </div>
                <div class="form-group">
                    <label>Видео</label>
                    <input class="form-group-file" type="file" accept="video/*">
                </div>
                <div class="form-group">
                    <label>Статус</label>
                    <input type="text" value="{{ .service.Status }}">
                </div>
                <div class="form-group" style="justify-content: center; margin-top: 20px;">
                    <button type="button" class="save-btn">Сохранить</button>
                </div>
            </form>
            {{ end }}
        </div>
    </div>
    {{ template "nav.html" . }}
</div>
</body>
</html>
