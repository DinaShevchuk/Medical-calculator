<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/styles/style.css">
</head>
<body>
<div class="phone">
    <div class="container">
        <div class="card-head">
            <label>Новый препарат</label>
        </div>
        <div class="add-page">
            {{ if .error }}
            <div class="error-message">{{ .error }}</div>
            {{ end }}

            {{ if eq .Step 1 }}
            <form method="POST" action="/drugs/create" enctype="multipart/form-data">
                <div class="form-group">
                    <label>Название</label>
                    <input type="text" name="title" value="{{ .drug.Title }}" required>
                </div>

                <div class="form-group">
                    <label>Фото</label>
                    <input class="form-group-file" type="file" name="image" accept="image/*">
                </div>
                <div class="file-preview" id="photoPreview">
                    <img src="/static/defaults/image.png" alt="Фото по умолчанию">
                </div>

                <div class="form-group">
                    <label>Видео</label>
                    <input class="form-group-file" type="file" name="video" accept="video/*">
                </div>
                <div class="file-preview" id="videoPreview">
                    <video src="/static/defaults/video.mp4" autoplay muted loop playsinline></video>
                </div>

                <div class="form-actions center">
                    <button type="submit" class="save-btn">Далее</button>
                </div>
            </form>
            {{ else }}
            <form method="POST" action="/drugs/publish">
                <input type="hidden" name="id" value="{{ .drug.ID }}">

                <div class="form-group">
                    <label>Название</label>
                    <input type="text" name="title" value="{{ .drug.Title }}" required>
                </div>

                <!-- Превью фото и видео (только для чтения) -->
                <div class="media-preview-row">
                    <div class="media-preview-item">
                        {{ if .drug.ImageKey }}
                        <img src="http://localhost:9000/media/{{ .drug.ImageKey }}"
                            alt="Фото"
                            onerror="this.onerror=null; this.src='/static/defaults/image.png';">
                        {{ else }}
                        <img src="/static/defaults/image.png" alt="Фото">
                        {{ end }}
                    </div>

                    <div class="media-preview-item">
                        {{ if .drug.VideoKey }}
                        <video src="http://localhost:9000/media/{{ .drug.VideoKey }}"
                            autoplay muted loop playsinline
                            onerror="this.onerror=null; this.src='/static/defaults/video.mp4'; this.load();"></video>
                        {{ else }}
                        <video src="/static/defaults/video.mp4" autoplay muted loop playsinline></video>
                        {{ end }}
                    </div>
                </div>

                <div class="form-group">
                    <label>Доза</label>
                    <label style="font-size: 13px; margin-top:auto;">(взрослого)</label>
                    <input type="number" name="adult_dose" value="{{ .drug.AdultDose }}" required min="1">
                    <label>мг/кг</label>
                </div>
                <div class="form-group">
                    <label>Концентрация</label>
                    <input class="NoBorder" type="number" step="0.1" min="0"
                        name="concentration_percent" value="{{ .drug.Concentration }}">
                    <label>%</label>
                </div>
                <div class="form-group DescriptionText">
                    <label>Дополнительная информация</label>
                    <textarea rows="3" name="description">{{ .drug.Description }}</textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="save-btn">Опубликовать</button>
                </div>
            </form>
            {{ end }}
        </div>
    </div>
    {{ template "nav.html" . }}
</div>
</body>
</html>
